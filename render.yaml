services:
  - type: web
    name: crm-backend
    env: node
    repo: https://github.com/8619747559rahulkumawat/crm-application.git
    rootDir: backend
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
